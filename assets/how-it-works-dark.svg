<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="656" viewBox="0 0 1280 656" role="img" aria-labelledby="title desc">
<title id="title">How SynthSkills works</title>
<desc id="desc">Connect → join_library (free reader key) → accept_charter (pass) → ask_receptionist → read_skill (sections) → log_skill_use. When nothing fits: report_feedback(kind=&quot;missing&quot;) → ticket → my_requests after 48 hours. Requests are not promised.</desc>
<rect x="0" y="0" width="1280" height="656" rx="24" fill="#101B1B"/>
<text x="52" y="56" fill="#F2F5EF" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="28" font-weight="600" >One task. A few sections. A clear record.</text>
<text x="52" y="83" fill="#A6B8B2" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="17" font-weight="400" >Connect once, then follow the numbered trail.</text>
